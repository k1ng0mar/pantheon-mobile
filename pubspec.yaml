name: pantheon_mobile
description: Pantheon mobile companion — runs, approvals, usage and schedules from your Pantheon runtime.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.1.2
  syntax_highlight: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-spacegrotesk.txt
    - assets/fonts/OFL-inter.txt
    - assets/fonts/OFL-jetbrainsmono.txt
    - assets/themes/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf

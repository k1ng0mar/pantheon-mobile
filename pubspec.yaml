name: pantheon_mobile
description: Pantheon mobile companion — runs, approvals, usage and schedules from your Pantheon runtime.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.4
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  path_provider: ^2.1.5
  open_filex: ^4.3.0
  url_launcher: ^6.3.1
  syntax_highlight: ^0.5.0
  record: ^6.2.0
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-spacegrotesk.txt
    - assets/fonts/OFL-inter.txt
    - assets/fonts/OFL-jetbrainsmono.txt
    - assets/themes/
    - assets/avatars/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf

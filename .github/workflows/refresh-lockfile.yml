name: refresh-lockfile

# Manual only. Regenerates pubspec.lock against the current pubspec.yaml and commits it back.
# Needed because pubspec.lock was committed with a broken resolve (record 5.2.1 / record_linux 0.7.2)
# that CI silently re-resolved. Run this after any dependency change to keep the lock honest.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate lockfile
        run: flutter pub get

      - name: Commit if changed
        run: |
          if git diff --quiet pubspec.lock; then
            echo "pubspec.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore: regenerate pubspec.lock"
          git push
